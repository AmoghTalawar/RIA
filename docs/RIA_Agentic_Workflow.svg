<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55606E"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A6C9B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E7F63"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1F2D45" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2D45">RIA – Agentic Workflow</text>
  <text x="800" y="68" text-anchor="middle" font-size="14" fill="#55606E">How a question becomes a trusted answer</text>

  <!-- Bands -->
  <rect x="30" y="85" width="1540" height="130" rx="14" fill="#EEF1F6" stroke="#C9D1DD"/>
  <rect x="30" y="235" width="1540" height="385" rx="14" fill="#EEF3EE" stroke="#C5D3C5"/>
  <rect x="30" y="640" width="1540" height="230" rx="14" fill="#F6F1E8" stroke="#DDD2BC"/>

  <rect x="45" y="74" width="190" height="22" rx="11" fill="#5B6B84"/>
  <text x="140" y="89" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">USER &amp; EXTERNAL AI</text>
  <rect x="45" y="224" width="190" height="22" rx="11" fill="#5E7F63"/>
  <text x="140" y="239" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">RIA AGENT · BACKEND</text>
  <rect x="45" y="629" width="190" height="22" rx="11" fill="#A08B5B"/>
  <text x="140" y="644" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">DATA</text>

  <!-- ===== Step 1: User ===== -->
  <rect x="60" y="110" width="300" height="60" rx="10" fill="#fff" stroke="#5B6B84" stroke-width="1.5" filter="url(#sh)"/>
  <text x="210" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2D45">User asks a question</text>
  <text x="210" y="155" text-anchor="middle" font-size="12" fill="#55606E">Chat · any role (Faculty → Vice Chancellor)</text>
  <text x="385" y="145" font-size="12" font-style="italic" fill="#55606E">e.g. “Compare CSE and ECE publications”</text>
  <circle cx="60" cy="110" r="12" fill="#1F2D45"/><text x="60" y="114.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>

  <!-- ===== LLM API ===== -->
  <rect x="1010" y="110" width="280" height="60" rx="10" fill="#fff" stroke="#7A6C9B" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1150" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3F6B">LLM API</text>
  <text x="1150" y="155" text-anchor="middle" font-size="12" fill="#55606E">Groq / OpenAI-compatible · function calling</text>

  <!-- ===== Step 9: Final answer ===== -->
  <rect x="1330" y="110" width="220" height="60" rx="10" fill="#fff" stroke="#5B6B84" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1440" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2D45">Final answer</text>
  <text x="1440" y="155" text-anchor="middle" font-size="12" fill="#55606E">Role-appropriate, shown in chat</text>
  <circle cx="1330" cy="110" r="12" fill="#1F2D45"/><text x="1330" y="114.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9</text>

  <!-- ===== Step 2 ===== -->
  <rect x="60" y="270" width="250" height="90" rx="10" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="185" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2D45">Access check</text>
  <text x="185" y="326" text-anchor="middle" font-size="12" fill="#55606E">Verify login (JWT), load role,</text>
  <text x="185" y="342" text-anchor="middle" font-size="12" fill="#55606E">department and institute</text>
  <circle cx="60" cy="270" r="12" fill="#1F2D45"/><text x="60" y="274.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>

  <!-- ===== Step 3 ===== -->
  <rect x="350" y="270" width="250" height="90" rx="10" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="475" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2D45">Persona &amp; context</text>
  <text x="475" y="326" text-anchor="middle" font-size="12" fill="#55606E">Role persona · chat history</text>
  <text x="475" y="342" text-anchor="middle" font-size="12" fill="#55606E">+ dashboard context</text>
  <circle cx="350" cy="270" r="12" fill="#1F2D45"/><text x="350" y="274.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>

  <!-- ===== Step 4 ===== -->
  <rect x="640" y="270" width="250" height="90" rx="10" fill="#fff" stroke="#5E7F63" stroke-width="2.5" filter="url(#sh)"/>
  <text x="765" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2D45">Tool filter (scope guard)</text>
  <text x="765" y="326" text-anchor="middle" font-size="12" fill="#55606E">AI only sees the tools</text>
  <text x="765" y="342" text-anchor="middle" font-size="12" fill="#55606E">this role is allowed to use</text>
  <circle cx="640" cy="270" r="12" fill="#1F2D45"/><text x="640" y="274.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>

  <!-- ===== Step 5: decision ===== -->
  <polygon points="1010,315 1150,245 1290,315 1150,385" fill="#fff" stroke="#7A6C9B" stroke-width="2" filter="url(#sh)"/>
  <text x="1150" y="311" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3F6B">AI reasoning</text>
  <text x="1150" y="330" text-anchor="middle" font-size="12" fill="#55606E">decide next step</text>
  <circle cx="1030" cy="283" r="12" fill="#1F2D45"/><text x="1030" y="287.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>

  <!-- ===== Step 6: tool call ===== -->
  <rect x="1020" y="450" width="260" height="110" rx="10" fill="#fff" stroke="#5E7F63" stroke-width="2.5" filter="url(#sh)"/>
  <text x="1150" y="478" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2D45">Call analytics tool</text>
  <text x="1150" y="496" text-anchor="middle" font-size="12" fill="#55606E">arguments checked · trusted scope added</text>
  <g font-size="11" text-anchor="middle" fill="#1F2D45">
    <rect x="1030" y="510" width="55" height="26" rx="6" fill="#E3ECE3" stroke="#B9CDBB"/><text x="1057.5" y="527">Faculty</text>
    <rect x="1093" y="510" width="55" height="26" rx="6" fill="#E3ECE3" stroke="#B9CDBB"/><text x="1120.5" y="527">Dept</text>
    <rect x="1156" y="510" width="55" height="26" rx="6" fill="#E3ECE3" stroke="#B9CDBB"/><text x="1183.5" y="527">Univ.</text>
    <rect x="1219" y="510" width="52" height="26" rx="6" fill="#E3ECE3" stroke="#B9CDBB"/><text x="1245" y="527">Rank</text>
  </g>
  <circle cx="1020" cy="450" r="12" fill="#1F2D45"/><text x="1020" y="454.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>

  <!-- ===== Step 8: observe ===== -->
  <rect x="700" y="450" width="260" height="110" rx="10" fill="#fff" stroke="#7A6C9B" stroke-width="1.5" filter="url(#sh)"/>
  <text x="830" y="488" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3F6B">Observe result</text>
  <text x="830" y="510" text-anchor="middle" font-size="12" fill="#55606E">Tool result goes back to the AI,</text>
  <text x="830" y="526" text-anchor="middle" font-size="12" fill="#55606E">which checks if it has enough data</text>
  <circle cx="700" cy="450" r="12" fill="#1F2D45"/><text x="700" y="454.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text>

  <!-- ===== Step 7: database ===== -->
  <g filter="url(#sh)">
    <path d="M1020,712 v88 a130,22 0 0 0 260,0 v-88" fill="#fff" stroke="#A08B5B" stroke-width="2"/>
    <ellipse cx="1150" cy="712" rx="130" ry="22" fill="#F3EBD9" stroke="#A08B5B" stroke-width="2"/>
  </g>
  <text x="1150" y="754" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2D45">Supabase PostgreSQL</text>
  <text x="1150" y="774" text-anchor="middle" font-size="12" fill="#55606E">schema “ria” · read-only access</text>
  <circle cx="1020" cy="712" r="12" fill="#1F2D45"/><text x="1020" y="716.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text>

  <!-- ===== Side: refusal ===== -->
  <rect x="380" y="410" width="260" height="56" rx="10" fill="#FBF3F0" stroke="#B88A7D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="510" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#7A4A3C">Out-of-scope request</text>
  <text x="510" y="452" text-anchor="middle" font-size="12" fill="#7A4A3C">Polite refusal + what you can ask</text>

  <!-- ===== Side: guardrails ===== -->
  <rect x="60" y="500" width="520" height="90" rx="10" fill="#fff" stroke="#5E7F63" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="526" font-size="14" font-weight="600" fill="#3F5F44">Guardrails</text>
  <text x="80" y="548" font-size="12" fill="#55606E">• Users only see data inside their own role scope</text>
  <text x="80" y="566" font-size="12" fill="#55606E">• Database is read-only · no data found → say so, never guess</text>

  <!-- ===== Arrows ===== -->
  <!-- 1 -> 2 -->
  <path d="M210,170 V270" fill="none" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="222" y="205" font-size="12" fill="#55606E">question + JWT</text>
  <!-- 2 -> 3 -> 4 -> 5 -->
  <path d="M310,315 H350" fill="none" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M600,315 H640" fill="none" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M890,315 H1010" fill="none" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="950" y="307" text-anchor="middle" font-size="12" fill="#55606E">allowed tools</text>
  <!-- 4 -> refusal -->
  <path d="M690,360 V438 H640" fill="none" stroke="#B88A7D" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="700" y="400" font-size="11" fill="#7A4A3C">not permitted</text>
  <!-- LLM <-> decision -->
  <path d="M1150,170 V245" fill="none" stroke="#7A6C9B" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#arrV)" marker-end="url(#arrV)"/>
  <text x="1162" y="212" font-size="12" fill="#4B3F6B">prompt ↔ response</text>
  <!-- 5 -> 9 -->
  <path d="M1290,315 H1440 V170" fill="none" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="1296" y="307" font-size="12" fill="#55606E">answer ready /</text>
  <text x="1296" y="337" font-size="12" fill="#55606E">general question</text>
  <!-- 5 -> 6 -->
  <path d="M1150,385 V450" fill="none" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="1162" y="422" font-size="12" fill="#55606E">needs data</text>
  <!-- 6 -> 7 -->
  <path d="M1150,560 V690" fill="none" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="1162" y="632" font-size="12" fill="#55606E">read-only SQL</text>
  <!-- 7 -> 8 -->
  <path d="M1020,770 H830 V560" fill="none" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="840" y="760" font-size="12" fill="#55606E">rows returned</text>
  <!-- 8 -> 5 loop -->
  <path d="M920,450 V355 H1081" fill="none" stroke="#7A6C9B" stroke-width="2" marker-end="url(#arrV)"/>
  <text x="928" y="412" font-size="12" font-weight="600" fill="#4B3F6B">Need more data?</text>
  <text x="928" y="428" font-size="12" fill="#4B3F6B">call tool again (loop)</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(60,690)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1F2D45">Legend</text>
    <path d="M0,22 H40" stroke="#55606E" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="52" y="26" font-size="12" fill="#55606E">Request / data flow</text>
    <path d="M0,48 H40" stroke="#7A6C9B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrV)"/>
    <text x="52" y="52" font-size="12" fill="#55606E">AI interaction</text>
    <path d="M0,74 H40" stroke="#B88A7D" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="52" y="78" font-size="12" fill="#55606E">Refusal path</text>
    <rect x="0" y="92" width="40" height="16" rx="4" fill="#fff" stroke="#5E7F63" stroke-width="2.5"/>
    <text x="52" y="105" font-size="12" fill="#55606E">Security checkpoint (steps 4 &amp; 6)</text>
  </g>
</svg>
