<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 930" width="1760" height="930" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2D45"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7686"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606E"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1F2D45" flood-opacity="0.12"/></filter>
    <style>
      .t{font-size:13px;font-weight:bold;fill:#1F2D45}
      .s{font-size:11px;fill:#55606E}
      .h{font-size:15px;font-weight:bold;fill:#1F2D45}
      .l{font-size:11px;fill:#1F2D45}
      .box{fill:#fff;stroke:#9AA7B4;stroke-width:1.2}
      .req{fill:none;stroke:#1F2D45;stroke-width:1.6}
      .res{fill:none;stroke:#6B7686;stroke-width:1.6;stroke-dasharray:6 4}
      .ing{fill:none;stroke:#55606E;stroke-width:1.8;stroke-dasharray:2 3}
    </style>
  </defs>
  <rect width="1760" height="930" fill="#fff"/>
  <text x="880" y="31" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F2D45">Research Intelligence Agent (RIA): Overall System Architecture</text>
  <text x="880" y="54" text-anchor="middle" font-size="15" fill="#55606E">KLE Technological University</text>

  <!-- Containers -->
  <rect x="20" y="105" width="185" height="535" rx="10" fill="#EEF1F6" stroke="#C9D1DD"/>
  <rect x="275" y="105" width="220" height="535" rx="10" fill="#EAEEF6" stroke="#C5CEE0"/>
  <rect x="575" y="105" width="595" height="535" rx="10" fill="#EEF3EE" stroke="#C5D3C5"/>
  <rect x="1240" y="435" width="180" height="150" rx="10" fill="#F1EEF5" stroke="#D2CBE0"/>
  <rect x="1490" y="105" width="250" height="535" rx="10" fill="#F6F1E8" stroke="#DDD2BC"/>
  <rect x="20" y="700" width="700" height="115" rx="10" fill="#F0F1F3" stroke="#CBD0D6"/>

  <!-- Users -->
  <text x="35" y="127" class="h" fill="#5B6B84">Users</text><text x="35" y="143" class="s">L1 – L5 access levels</text>
  <rect x="32" y="160" width="161" height="80" rx="8" fill="#fff" stroke="#5B6B84" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="182" class="t">Vice Chancellor /</text><text x="42" y="198" class="t">Admin (L1)</text><text x="42" y="218" class="s">University access</text>
  <rect x="32" y="250" width="161" height="80" rx="8" fill="#fff" stroke="#5B6B84" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="275" class="t">Executive Dean (L2)</text><text x="42" y="293" class="s">University aggregates</text>
  <rect x="32" y="340" width="161" height="80" rx="8" fill="#fff" stroke="#5B6B84" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="365" class="t">Faculty Dean (L3)</text><text x="42" y="383" class="s">Institute access</text>
  <rect x="32" y="430" width="161" height="80" rx="8" fill="#fff" stroke="#5B6B84" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="452" class="t">Head of Department</text><text x="42" y="468" class="t">(L4)</text><text x="42" y="488" class="s">Department access</text>
  <rect x="32" y="520" width="161" height="80" rx="8" fill="#fff" stroke="#5B6B84" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="545" class="t">Faculty (L5)</text><text x="42" y="563" class="s">Individual access</text>

  <!-- Frontend -->
  <text x="290" y="127" class="h" fill="#5F7099">Frontend</text><text x="290" y="143" class="s">Web Application (React + Vite)</text>
  <rect x="290" y="160" width="190" height="70" rx="8" fill="#fff" stroke="#5F7099" stroke-width="1.5" filter="url(#sh)"/>
  <text x="302" y="190" class="t">Login &amp; Session</text><text x="302" y="208" class="s">User sign-in</text>
  <rect x="290" y="245" width="190" height="70" rx="8" fill="#fff" stroke="#5F7099" stroke-width="1.5" filter="url(#sh)"/>
  <text x="302" y="275" class="t">Role-Based Dashboards</text><text x="302" y="293" class="s">Role-specific views</text>
  <rect x="290" y="330" width="190" height="70" rx="8" fill="#fff" stroke="#5F7099" stroke-width="1.5" filter="url(#sh)"/>
  <text x="302" y="360" class="t">Publication Explorer</text><text x="302" y="378" class="s">Search and filter</text>
  <rect x="290" y="415" width="190" height="70" rx="8" fill="#fff" stroke="#5F7099" stroke-width="1.5" filter="url(#sh)"/>
  <text x="302" y="445" class="t">Reports</text><text x="302" y="463" class="s">Charts and analytics</text>
  <rect x="290" y="500" width="190" height="70" rx="8" fill="#fff" stroke="#5F7099" stroke-width="1.5" filter="url(#sh)"/>
  <text x="302" y="530" class="t">AI Chat Assistant</text><text x="302" y="548" class="s">Ask questions in plain text</text>

  <!-- Backend -->
  <text x="595" y="127" class="h" fill="#5E7F63">Backend: API Server (FastAPI)</text>
  <rect x="960" y="111" width="200" height="24" rx="12" fill="#5E7F63"/>
  <text x="1060" y="127" text-anchor="middle" font-size="11" fill="#fff">Role-Based Access Control: 5 Levels</text>
  <rect x="620" y="165" width="220" height="70" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="632" y="193" class="t">Auth &amp; Scope Resolver</text><text x="632" y="211" class="s">JWT verification, role scope</text>
  <rect x="620" y="268" width="220" height="60" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="632" y="294" class="t">Query Normalizer</text><text x="632" y="312" class="s">Query cleaning</text>
  <rect x="620" y="362" width="220" height="60" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="632" y="388" class="t">Intent Router</text><text x="632" y="406" class="s">Fast path, no LLM</text>
  <rect x="950" y="362" width="200" height="60" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="962" y="388" class="t">Persona Manager</text><text x="962" y="406" class="s">L1 – L5 prompts</text>
  <rect x="592" y="490" width="140" height="70" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="604" y="518" class="t">Analytics Tools</text><text x="604" y="536" class="s">Scoped SQL</text>
  <rect x="802" y="490" width="140" height="70" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="814" y="516" class="t">Scope Guard</text><text x="814" y="533" class="s">Tool allow-list,</text><text x="814" y="547" class="s">injected scope</text>
  <rect x="1012" y="490" width="140" height="70" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1024" y="518" class="t">AI Agent</text><text x="1024" y="536" class="s">Tool-calling loop</text>
  <rect x="592" y="585" width="120" height="45" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="604" y="605" class="t" font-size="12">Response Cache</text><text x="604" y="620" class="s" font-size="10">Results, 5-min TTL</text>

  <!-- External AI -->
  <text x="1255" y="458" class="h" fill="#7A6C9B" font-size="14">External AI</text><text x="1255" y="474" class="s">LLM Provider</text>
  <rect x="1255" y="486" width="150" height="84" rx="8" fill="#fff" stroke="#7A6C9B" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1330" y="510" text-anchor="middle" class="t" font-size="12">Groq</text>
  <text x="1330" y="528" text-anchor="middle" class="t" font-size="12">Gemini</text>
  <text x="1330" y="546" text-anchor="middle" class="t" font-size="12">OpenRouter</text>

  <!-- Data & Auth -->
  <text x="1505" y="127" class="h" fill="#A08B5B">Data &amp; Authentication</text><text x="1505" y="143" class="s">Supabase</text>
  <rect x="1510" y="160" width="210" height="70" rx="8" fill="#fff" stroke="#A08B5B" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1522" y="188" class="t">Supabase Auth</text><text x="1522" y="206" class="s">Issues and validates JWT</text>
  <rect x="1505" y="255" width="220" height="365" rx="8" fill="#fff" stroke="#A08B5B" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1517" y="280" class="t">PostgreSQL Database</text><text x="1517" y="297" class="s">Row-Level Security</text>
  <rect x="1520" y="320" width="190" height="44" rx="6" fill="#F6F1E8" stroke="#DDD2BC"/><text x="1535" y="347" class="l" font-size="12">Publications</text>
  <rect x="1520" y="372" width="190" height="44" rx="6" fill="#F6F1E8" stroke="#DDD2BC"/><text x="1535" y="399" class="l" font-size="12">Faculty</text>
  <rect x="1520" y="424" width="190" height="44" rx="6" fill="#F6F1E8" stroke="#DDD2BC"/><text x="1535" y="451" class="l" font-size="12">Departments</text>
  <rect x="1520" y="476" width="190" height="44" rx="6" fill="#F6F1E8" stroke="#DDD2BC"/><text x="1535" y="503" class="l" font-size="12">Institutes</text>
  <rect x="1520" y="528" width="190" height="44" rx="6" fill="#F6F1E8" stroke="#DDD2BC"/><text x="1535" y="555" class="l" font-size="12">Profiles</text>

  <!-- Data sources -->
  <text x="35" y="722" class="h" fill="#6B7480">Data Sources</text><text x="140" y="722" class="s">(Research &amp; organization data)</text>
  <rect x="35" y="738" width="205" height="55" rx="8" fill="#fff" stroke="#6B7480" stroke-width="1.5" filter="url(#sh)"/>
  <text x="47" y="762" class="t" font-size="12">Scopus / Web of Science</text><text x="47" y="780" class="s">Publication records</text>
  <rect x="255" y="738" width="205" height="55" rx="8" fill="#fff" stroke="#6B7480" stroke-width="1.5" filter="url(#sh)"/>
  <text x="267" y="762" class="t" font-size="12">Google Scholar / Excel / CSV</text><text x="267" y="780" class="s">Additional records</text>
  <rect x="475" y="738" width="230" height="55" rx="8" fill="#fff" stroke="#6B7480" stroke-width="1.5" filter="url(#sh)"/>
  <text x="487" y="762" class="t" font-size="12">ERP / Faculty Master Data</text><text x="487" y="780" class="s">Faculty and organization data</text>
  <rect x="770" y="725" width="230" height="80" rx="8" fill="#fff" stroke="#5E7F63" stroke-width="1.5" filter="url(#sh)"/>
  <text x="782" y="755" class="t">Data Ingestion &amp; ID Matching</text><text x="782" y="775" class="s">Clean, match, merge</text>

  <!-- Arrows: request flow -->
  <path d="M205,330 H275" class="req" marker-end="url(#ah)"/>
  <text x="240" y="315" text-anchor="middle" class="l">Login &amp;</text><text x="240" y="327" text-anchor="middle" class="l">Queries</text>

  <path d="M480,185 H535 V80 H1700 V160" class="req" marker-end="url(#ah)"/>
  <text x="1000" y="73" text-anchor="middle" class="l">Sign in, JWT issued</text>

  <path d="M495,260 H555 V200 H620" class="req" marker-end="url(#ah)"/>
  <text x="532" y="282" text-anchor="middle" class="l" font-size="10">HTTPS +</text><text x="532" y="294" text-anchor="middle" class="l" font-size="10">Bearer JWT</text>

  <path d="M840,185 H1510" class="req" marker-end="url(#ah)"/>
  <text x="1000" y="178" text-anchor="middle" class="l">Verify JWT</text>

  <path d="M840,222 H1455 V550 H1520" class="req" marker-end="url(#ah)"/>
  <text x="1000" y="238" text-anchor="middle" class="l">Load role &amp; scope</text>

  <path d="M730,235 V268" class="req" marker-end="url(#ah)"/>
  <path d="M730,328 V362" class="req" marker-end="url(#ah)"/>

  <path d="M660,422 V490" class="req" marker-end="url(#ah)"/>
  <text x="667" y="472" class="l">Direct answer</text>
  <path d="M800,422 V455 H1050 V490" class="req" marker-end="url(#ah)"/>
  <text x="862" y="449" class="l">Complex query</text>
  <path d="M1110,422 V490" class="req" marker-end="url(#ah)"/>
  <text x="1104" y="440" text-anchor="end" class="l">Role prompt</text>

  <path d="M1012,525 H942" class="req" marker-end="url(#ah)"/>
  <text x="977" y="500" text-anchor="middle" class="l" font-size="10">Authorize &amp;</text><text x="977" y="512" text-anchor="middle" class="l" font-size="10">inject scope</text>
  <path d="M802,525 H732" class="req" marker-end="url(#ah)"/>

  <path d="M1152,525 H1255" class="req" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="1205" y="503" text-anchor="middle" class="l" font-size="10">Tool calls /</text><text x="1205" y="515" text-anchor="middle" class="l" font-size="10">results</text>

  <path d="M632,560 V585" class="req" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="640" y="577" class="l" font-size="10">Cache results</text>

  <path d="M722,560 V605 H1505" class="req" marker-end="url(#ah)"/>
  <text x="1000" y="598" text-anchor="middle" class="l">Scoped SQL queries</text>

  <!-- Response flow -->
  <path d="M600,640 V670 H385 V640" class="res" marker-end="url(#ad)"/>
  <rect x="415" y="661" width="150" height="18" fill="#fff"/>
  <text x="490" y="674" text-anchor="middle" class="l" fill="#6B7686">Response (answer + source)</text>

  <!-- Ingestion flow -->
  <path d="M720,765 H770" class="ing" marker-end="url(#ao)"/>
  <path d="M1000,765 H1600 V620" class="ing" marker-end="url(#ao)"/>
  <text x="1300" y="757" text-anchor="middle" class="l" fill="#55606E">Scheduled load, ID-based mapping</text>

  <!-- Bottom strip -->
  <rect x="20" y="845" width="540" height="55" rx="8" fill="#EEF1F6" stroke="#C9D1DD"/>
  <text x="35" y="878" font-size="14" fill="#1F2D45"><tspan font-weight="bold">Hierarchy:</tspan> University  ▸  Institute  ▸  Department  ▸  Faculty</text>
  <rect x="580" y="845" width="290" height="55" rx="8" fill="#EEF3EE" stroke="#C5D3C5"/>
  <text x="595" y="878" font-size="13" fill="#1F2D45">Data scoped by role at every layer</text>
  <rect x="890" y="845" width="480" height="55" rx="8" fill="#F6F1E8" stroke="#DDD2BC"/>
  <text x="905" y="865" class="t" font-size="12">Flow summary</text>
  <text x="905" y="884" class="s" font-size="11">Login → Verify → Route → (Fast path | AI Agent) → Scoped data → Response</text>

  <!-- Legend -->
  <rect x="1400" y="775" width="340" height="125" rx="8" fill="#fff" stroke="#B4BCC4"/>
  <text x="1415" y="797" class="t" font-size="13">Legend</text>
  <path d="M1415,820 H1475" class="req" marker-end="url(#ah)"/><text x="1490" y="824" class="l" font-size="12">Request flow</text>
  <path d="M1415,848 H1475" class="res" marker-end="url(#ad)"/><text x="1490" y="852" class="l" font-size="12">Response flow</text>
  <path d="M1415,876 H1475" class="ing" marker-end="url(#ao)"/><text x="1490" y="880" class="l" font-size="12">Scheduled data ingestion</text>
</svg>
